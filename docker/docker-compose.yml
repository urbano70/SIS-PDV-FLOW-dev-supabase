      DATABASE_URL: postgresql://pdv:${DB_PASSWORD_2:-pdv_secret_2}@postgres-2:5432/pdv
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      ALLOWED_ORIGINS: https://${DOMAIN_2:-cliente2.pdv.com.br}
