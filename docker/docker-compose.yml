  postgres-5:
    image: postgres:16-alpine
    container_name: pdv-db-5
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdv
      POSTGRES_USER: pdv
      POSTGRES_PASSWORD: ${DB_PASSWORD_5:-pdv_secret_5}
