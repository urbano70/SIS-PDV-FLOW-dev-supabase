version: '3.8'

# ================================================================
# SIS-PDV — 5 clientes na mesma VPS
# Cada cliente: 1 container Node.js + 1 container PostgreSQL
# Nginx roteia por subdomínio para cada cliente
# ================================================================

services:

  # ─── CLIENTE 1 ──────────────────────────────────────────────
  pdv-cliente-1:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sis-pdv:latest
    container_name: pdv-cliente-1
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://pdv:${CLIENTE1_DB_PASS:-pdv123}@postgres-cliente-1:5432/pdv
      - SUPABASE_URL=${CLIENTE1_SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${CLIENTE1_SUPABASE_SERVICE_ROLE_KEY:-}
      - VITE_SUPABASE_URL=${CLIENTE1_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${CLIENTE1_SUPABASE_ANON_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      postgres-cliente-1:
        condition: service_healthy
    networks:
      - pdv-network

  postgres-cliente-1:
    image: postgres:16-alpine
    container_name: postgres-cliente-1
    restart: unless-stopped
    environment:
      - POSTGRES_DB=pdv
      - POSTGRES_USER=pdv
      - POSTGRES_PASSWORD=${CLIENTE1_DB_PASS:-pdv123}
    volumes:
      - postgres-cliente-1-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdv -d pdv"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pdv-network

