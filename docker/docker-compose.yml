  # ─── NGINX — roteador de subdomínios ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: pdv-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - pdv-cliente-1
      - pdv-cliente-2
      - pdv-cliente-3
      - pdv-cliente-4
      - pdv-cliente-5
    networks:
      - pdv-network

volumes:
  postgres-cliente-1-data:
  postgres-cliente-2-data:
  postgres-cliente-3-data:
  postgres-cliente-4-data:
  postgres-cliente-5-data:

networks:
  pdv-network:
    driver: bridge
