worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream pdv_1 { server pdv-app-1:3001; }
    upstream pdv_2 { server pdv-app-2:3001; }
    upstream pdv_3 { server pdv-app-3:3001; }
    upstream pdv_4 { server pdv-app-4:3001; }
    upstream pdv_5 { server pdv-app-5:3001; }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── CLIENTE 1 — substitua DOMAIN_1 pelo domínio real ──────────────────
    server {
        listen 443 ssl http2;
        server_name DOMAIN_1;

        ssl_certificate     /etc/letsencrypt/live/DOMAIN_1/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMAIN_1/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://pdv_1;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }
    }

