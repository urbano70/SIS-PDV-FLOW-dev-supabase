events {
    worker_connections 1024;
}

http {
    # Roteamento por subdomínio
    upstream cliente1 { server pdv-cliente-1:3000; }
    upstream cliente2 { server pdv-cliente-2:3000; }
    upstream cliente3 { server pdv-cliente-3:3000; }
    upstream cliente4 { server pdv-cliente-4:3000; }
    upstream cliente5 { server pdv-cliente-5:3000; }

    # Suporte a WebSocket (Socket.IO)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Timeouts globais para WebSocket de longa duração
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # ─── CLIENTE 1 ──────────────────────────────────────────
    server {
        listen 80;
        server_name cliente1.seupdv.com.br;

        location / {
            proxy_pass         http://cliente1;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ─── CLIENTE 2 ──────────────────────────────────────────
    server {
        listen 80;
        server_name cliente2.seupdv.com.br;

        location / {
            proxy_pass         http://cliente2;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ─── CLIENTE 3 ──────────────────────────────────────────
    server {
        listen 80;
        server_name cliente3.seupdv.com.br;

        location / {
            proxy_pass         http://cliente3;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ─── CLIENTE 4 ──────────────────────────────────────────
    server {
        listen 80;
        server_name cliente4.seupdv.com.br;

        location / {
            proxy_pass         http://cliente4;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ─── CLIENTE 5 ──────────────────────────────────────────
    server {
        listen 80;
        server_name cliente5.seupdv.com.br;

        location / {
            proxy_pass         http://cliente5;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ─── Página padrão (IP direto / domínio desconhecido) ───
    server {
        listen 80 default_server;
        server_name _;
        return 404;
    }
}
